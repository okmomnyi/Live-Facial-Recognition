services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lfr
      POSTGRES_PASSWORD: lfr_dev_password
      POSTGRES_DB: lfr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init.sql runs only on first init of an empty data volume.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lfr -d lfr"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override the .env host so the container reaches the db service.
      DATABASE_URL: postgresql+asyncpg://lfr:lfr_dev_password@db:5432/lfr
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      # Persist downloaded InsightFace models across container restarts.
      - insightface:/root/.insightface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  insightface:
